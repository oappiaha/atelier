# Atelier production stack — runs on the droplet at /opt/atelier.
# Usage: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Secrets live ONLY in /opt/atelier/.env.prod (never in git).
# All host bindings are 127.0.0.1-only; nginx terminates TLS and proxies /api/ -> :8010.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atelier
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 448m

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    # one worker covering BOTH queues at this scale: default (thumbs) + wada (model calls)
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery,wada --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 512m

volumes:
  pg-data:
