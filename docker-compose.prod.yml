# Atelier production stack — runs on the droplet at /opt/atelier.
# Usage: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Secrets live ONLY in /opt/atelier/.env.prod (never in git).
# All host bindings are 127.0.0.1-only; nginx terminates TLS and proxies /api/ -> :8010.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atelier
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 448m

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    # one worker covering BOTH queues at this scale: default (thumbs) + wada (model calls)
    #
    # concurrency stays 2 under the PARALLEL-1 colorway fan-out (measured, not
    # guessed): the wada pipeline is network-bound at the fal call (~39s) but
    # MEMORY-bound at the per-node guards — a 1536² frame with a 1.21M-px slot
    # peaks at ~164MB RSS per task even after the ΔE chunking in
    # app/wada/generation.py (it was 590MB before). Two concurrent chains fit
    # inside mem_limit 512m with room for the forked interpreters; three do not
    # (3 × ~164MB of pixel work + ~80MB per prefork child ≈ 730MB). Raise
    # mem_limit to 768m FIRST if this is ever taken to --concurrency=3.
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery,wada --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 512m

volumes:
  pg-data:
