# wada.garden — Atelier SPA + API proxy.
# Installed at /etc/nginx/sites-available/wada.garden (symlinked into sites-enabled).
# HTTP-only bootstrap block; certbot --nginx rewrites it for TLS once DNS resolves.
server {
    listen 80;
    listen [::]:80;
    server_name wada.garden www.wada.garden;

    root /var/www/wada.garden;
    index index.html;

    # uploads go direct to R2 via presigned PUT, but commit/inline payloads get headroom
    client_max_body_size 50m;

    # Same-origin API contract (load-bearing, see PROGRESS.md "Prod routing is
    # load-bearing"): /api/<path> -> backend /<path> (prefix stripped by the
    # trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets can cache hard
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
