name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs against REAL infra (conftest self-provisions an isolated
    # atelier_test DB + atelier-test bucket) — mirror docker-compose.yml's
    # non-default host ports and creds exactly.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6380:6379"]
      minio:
        image: bitnami/minio:2025
        env:
          MINIO_ROOT_USER: atelier
          MINIO_ROOT_PASSWORD: atelier-local
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
