name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs against REAL infra (conftest self-provisions an isolated
    # atelier_test DB + atelier-test bucket) — mirror docker-compose.yml's
    # non-default host ports and creds exactly.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      # Community container images are no longer publicly pullable. Build
      # the pinned upstream release for this disposable test service.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      - name: Start MinIO
        run: |
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          MINIO_ROOT_USER=atelier MINIO_ROOT_PASSWORD=atelier-local \
            "$(go env GOPATH)/bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break; sleep 1;
          done
          curl -fsS http://localhost:9000/minio/health/live
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
