[project]
name = "atelier-api"
version = "0.1.0"
description = "Atelier — design archive + Wada colorway studio (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "boto3>=1.34",
    "pillow>=11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Wada segmentation/refinement stack (M5) — segment.py/refine.py import these
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "google-genai>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# the app's SQLAlchemy engine is module-level: every test must share one loop
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
